specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Rutter
providerId: rutter-io
created: '2026-07-01'
modified: '2026-07-01'
reconciled: false
tags:
- Unified API
- Accounting
- Commerce
- Payments
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Rutter spend. Rutter is a unified-API vendor billed under a
  sales-negotiated commercial agreement rather than public usage rates. Cost
  drivers are the number of connected end-users (merchant connections), the
  product areas enabled (Accounting, Commerce, Payments), and platform
  coverage. Because pricing is contract-based, allocation is driven by
  connection counts and product usage rather than metered per-call rates.
notes: >-
  No public rate card; meters below describe cost-driver dimensions to track
  internally for allocation, not confirmed billed units. Confirm the billing
  model with Rutter during reconciliation.
sources:
- https://www.rutter.com/pricing
- https://docs.rutterapi.com/docs/introduction
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Rutter
serviceCategory: Integration and API Management
billingModel:
  pricingCategory: Committed-Use
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Rutter Unified API
  ServiceCategory: Integration and API Management
  ProviderName: Rutter
  PublisherName: Rutter
  InvoiceIssuerName: Rutter
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Committed-Use
meters:
- name: connections
  description: Number of active connected end-users (merchant connections), the primary cost driver.
  unit: connections
  aggregation: max
  dimensions:
  - application
  - platform
- name: product_area
  description: Product areas enabled (Accounting, Commerce, Payments), which affect contracted price.
  unit: products
  aggregation: max
  dimensions:
  - application
  - product
- name: platform_coverage
  description: Set of underlying platforms integrated (QuickBooks, Shopify, Stripe, etc.).
  unit: platforms
  aggregation: max
  dimensions:
  - application
- name: write_operations
  description: Write-back operations (e.g. creating invoices or journal entries) where usage may factor into commercial terms.
  unit: operations
  aggregation: sum
  dimensions:
  - application
  - connection
  - api
principles:
- name: Visibility
  description: Track active connection counts per application and per platform; reconcile against the Rutter agreement.
- name: Allocation
  description: Map connections and enabled product areas to internal customers/teams and cost centers.
- name: Optimization
  description: Deprovision unused connections; enable only the product areas in use; avoid redundant historical re-syncs.
- name: Accountability
  description: Assign owners per integration; review connection growth against the contracted commitment monthly.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
