name: Rutter
kind: company
description: Rutter is a unified API for commerce, accounting, and payments. Developers
  integrate once and read and write normalized business data across QuickBooks, Xero,
  NetSuite, Sage Intacct, Shopify, Amazon, Stripe, and dozens of other platforms.
  Rutter authenticates with Basic auth (client_id:secret) and an X-Rutter-Version
  header, and scopes each request to an end-user's connection via an access_token.
